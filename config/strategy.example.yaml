# Example strategy / application configuration.
#
# Copy this to `config/strategy.yaml` and edit. Secrets should be provided as
# `${ENV_VAR}` placeholders and supplied via the environment or a `.env` file.

robinhood:
  mcp_url: "https://agent.robinhood.com/mcp/trading"
  api_token: "${ROBINHOOD_MCP_TOKEN}"

llm:
  provider: openai
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o"
  temperature: 0.2
  max_tokens: 2048

# Define one or more strategies. Each runs sequentially every scheduler tick.
# Use `strategy:` (singular) as a shorthand when you only have one.
strategies:
  - name: "Conservative Momentum"
    description: "Buy large-cap tech near 52-week lows. Exit on stop-loss or take-profit."
    # Restrict to these symbols (optional — omit or set to [] to trade any symbol).
    watchlist: [AAPL, MSFT, NVDA, GOOGL, META]
    # Focus industries / sectors (optional — used as guidance when watchlist is empty or combined with it).
    # industries: []
    structured:
      stop_loss_pct: 5.0
      take_profit_pct: 15.0
      max_positions: 3
      min_confidence: 0.70
      buy_filters:
        max_pe_ratio: 30.0
        max_price_vs_52w_high_pct: 90.0
        min_volume_ratio: 0.80
    rules:
      - "Prefer companies with strong cash flow and low debt"
      - "Avoid buying within 5 trading days of an earnings announcement"
      - "When multiple buy signals exist, prefer the symbol closest to its 52-week low"

  - name: "AI & Energy Thematic"
    description: "Capture momentum in AI infrastructure and energy transition companies."
    # No fixed watchlist — let the LLM discover symbols in these industries.
    watchlist: []
    industries: [AI, Semiconductors, Data Centers, Renewable Energy, Nuclear Energy]
    structured:
      stop_loss_pct: 8.0
      take_profit_pct: 25.0
      max_positions: 5
      min_confidence: 0.65
      buy_filters:
        max_pe_ratio: 60.0
    rules:
      - "Prefer companies with direct AI infrastructure revenue (chips, data centres, power)"
      - "Weight toward profitable companies; tolerate high P/E only with strong revenue growth"
      - "For energy plays, prefer companies with a clear path to AI-related demand growth"

risk:
  dry_run: true                   # MUST be false to place real orders.
  max_trade_usd: 500.0            # Hard cap on any single order's value.
  max_position_pct: 0.10          # No position may exceed 10% of equity.
  max_daily_trades: 5             # Circuit breaker.
  min_cash_reserve_pct: 0.20      # Informational; surfaced to the LLM.
  allow_buys: true
  allow_sells: true

scheduler:
  interval_minutes: 15

audit:
  log_dir: "./logs"
  log_file: "audit.jsonl"

simulation:
  starting_cash: 10000.0
  portfolio_path: "./simulation/portfolio.json"
