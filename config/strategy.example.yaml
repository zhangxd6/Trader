# Example strategy / application configuration.
#
# Copy this to `config/strategy.yaml` and edit. Secrets should be provided as
# `${ENV_VAR}` placeholders and supplied via the environment or a `.env` file.

robinhood:
  mcp_url: "https://agent.robinhood.com/mcp/trading"
  api_token: "${ROBINHOOD_MCP_TOKEN}"

llm:
  provider: anthropic
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-sonnet-4-6"
  temperature: 0.2
  max_tokens: 2048
  # Other supported providers:
  #   provider: openai
  #   api_key: "${OPENAI_API_KEY}"
  #   model: "gpt-4o"
  #
  #   provider: openai-compatible   # Groq, Ollama, Azure, Together, ...
  #   api_key: "${GROQ_API_KEY}"
  #   model: "llama-3.3-70b-versatile"
  #   base_url: "https://api.groq.com/openai/v1"
  #
  #   provider: anthropic-compatible  # custom Claude proxy / gateway
  #   api_key: "${PROXY_API_KEY}"
  #   model: "claude-sonnet-4-6"
  #   base_url: "https://my-proxy.internal/v1/messages"

# ── Single-strategy shorthand ────────────────────────────────────────────────
# Use `strategy:` (singular) when you only need one. The system automatically
# wraps it in a list. To run multiple strategies per tick, switch to
# `strategies:` (plural) — see the multi-strategy example at the bottom.

strategy:
  name: "Mag7 Dip Buyer"
  description: >
    Buy the Magnificent 7 when they pull back from recent highs. Hold for
    momentum recovery. Exit on stop-loss or take-profit. Never chase; only
    enter on weakness. Preserve at least 30% cash at all times.

  # Hard enforcement: only these tickers will ever be traded (Rust-enforced).
  # Omit or set to [] to let the LLM choose freely.
  watchlist: [AAPL, MSFT, NVDA, GOOGL, META, AMZN, TSLA]

  # Sector guidance injected into the LLM prompt. Helps it reason about
  # industry context. Combined with watchlist = hard list + soft context.
  industries: [Technology, AI, Cloud Computing, Electric Vehicles]

  # Structured thresholds — enforced by Rust regardless of LLM output.
  structured:
    stop_loss_pct:    6.0    # Sell if a position is down more than 6%
    take_profit_pct: 20.0    # Sell if a position is up more than 20%
    max_positions:    4      # Hold at most 4 names at once
    min_confidence:   0.75   # Ignore decisions below this confidence score
    buy_filters:
      max_price_vs_52w_high_pct: 85.0  # Only buy if <= 85% of 52-week high
      min_volume_ratio: 0.90           # Skip if today's volume < 90% of average

  # Free-text judgment rules — passed verbatim to the LLM prompt.
  rules:
    - "Only BUY on a clear pullback — at least 5% below a recent local high"
    - "Do not open a new position if the broad market (SPY) is in a confirmed downtrend"
    - "Prioritise NVDA and MSFT for AI exposure; treat TSLA as higher-risk"
    - "If two signals tie, pick the name with the smaller existing position"
    - "Never add to a position that is already at a loss"

risk:
  dry_run: true          # MUST be false to place real orders
  max_trade_usd: 1000.0  # Hard cap per order
  max_position_pct: 0.20 # No single stock > 20% of portfolio
  max_daily_trades: 4    # Circuit breaker: at most 4 orders per day
  min_cash_reserve_pct: 0.30  # Always keep 30% in cash
  allow_buys: true
  allow_sells: true

scheduler:
  interval_minutes: 30   # Run every 30 minutes during market hours

audit:
  log_dir: "./logs"
  log_file: "audit.jsonl"

simulation:
  starting_cash: 10000.0
  portfolio_path: "./simulation/portfolio.json"


